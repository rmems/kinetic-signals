[package]
name = "kinetic-signals"
version = "0.5.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["Raul Cardenas Montoya"]
description = "Streaming feature extraction for high-velocity stochastic signals."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rmems/kinetic-signals"
homepage = "https://github.com/rmems/kinetic-signals"
documentation = "https://docs.rs/kinetic-signals"
readme = "README.md"
keywords = ["signals", "time-series", "stochastic", "hawkes", "surprise"]
categories = ["algorithms", "science"]
publish = ["crates-io"]
include = ["Cargo.toml", "CHANGELOG.md", "README.md", "LICENSE-APACHE-2.0", "LICENSE-MIT", "src/**", "examples/**"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[features]
default = []
serde = ["dep:serde"]

[[bench]]
name = "output_reuse"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
