# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
name: Linear Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to sync (for example, v0.5.0)'
        required: true
        type: string
      base_ref:
        description: 'Optional exclusive scan base for a dry run (for example, v0.4.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  linear-release:
    name: Report release to Linear
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'
          case "${EVENT_NAME}" in
            release)
              tag="${RELEASE_TAG}"
              ;;
            workflow_dispatch)
              tag="${INPUT_VERSION}"
              ;;
            push)
              tag="${GITHUB_REF_NAME}"
              ;;
            *)
              echo "Unexpected event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          if [[ ! "${tag}" =~ ${TAG_RE} ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Find previous release tag
        id: release_base
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          while IFS= read -r tag; do
            [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            [[ "${tag}" != "${TAG}" ]] || continue
            echo "base_ref=${tag}" >> "${GITHUB_OUTPUT}"
            exit 0
          done < <(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname)
          echo "No previous stable release tag is reachable from ${TAG}" >&2
          exit 1

      - name: Sync release commits and issues to Linear
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ steps.version.outputs.tag }}
          base_ref: ${{ steps.release_base.outputs.base_ref || inputs.base_ref || '' }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Complete release in Linear
        if: github.event_name == 'release'
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ steps.version.outputs.tag }}
