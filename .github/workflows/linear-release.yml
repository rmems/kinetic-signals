# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
name: Linear Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to sync (for example, v0.5.0)'
        required: true
        type: string
      base_ref:
        description: 'Optional exclusive scan base for a dry run (for example, v0.4.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  linear-release:
    name: Report release to Linear
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            release)
              echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
              ;;
            push)
              echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Find previous release tag
        id: release_base
        if: github.event_name == 'push'
        shell: bash
        run: |
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            [[ "$tag" != "${{ steps.version.outputs.tag }}" ]] || continue
            echo "base_ref=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          done < <(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname)
          echo "No previous stable release tag is reachable from ${{ steps.version.outputs.tag }}" >&2
          exit 1

      - name: Sync release commits and issues to Linear
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ steps.version.outputs.tag }}
          base_ref: ${{ steps.release_base.outputs.base_ref || inputs.base_ref || '' }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Complete release in Linear
        if: github.event_name == 'release'
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ steps.version.outputs.tag }}
